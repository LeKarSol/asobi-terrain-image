name: Build image

on:
  workflow_dispatch:
    inputs:
      asobi_ref:
        description: >-
          Ref de widgrensit/asobi a construir (tag vX.Y.Z, SHA, o vacío para
          usar la última release publicada).
        required: false
        default: ""
        type: string
      image_tag:
        description: >-
          Tag de la imagen a publicar. Vacío = tag del ref.
        required: false
        default: ""
        type: string
  push:
    tags:
      - "asobi-*"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve asobi ref
        id: ref
        run: |
          set -eu
          REF="${{ inputs.asobi_ref }}"

          # Push de tag asobi-* -> normalizar a vX.Y.Z
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${GITHUB_REF_NAME#asobi-}"
            case "$RAW" in
              v*) REF="$RAW" ;;
              *)  REF="v$RAW" ;;
            esac
          fi

          # Vacío (schedule o dispatch manual sin ref): última release publicada
          if [ -z "$REF" ]; then
            REF="$(gh api repos/widgrensit/asobi/releases/latest --jq .tag_name)"
          fi

          # GHCR exige nombres en minúsculas (github.repository puede traer el owner en mayúsculas)
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          IMAGE_BASE="ghcr.io/${OWNER}/${REPO,,}"

          echo "asobi_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_base=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "Resolved asobi ref: $REF"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if tag already published (schedule)
        id: skip
        if: github.event_name == 'schedule'
        run: |
          set -eu
          REF="${{ steps.ref.outputs.asobi_ref }}"
          if docker manifest inspect "${{ steps.ref.outputs.image_base }}:$REF" >/dev/null 2>&1; then
            echo "El tag $REF ya está publicado; saltando."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.skip.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            ASOBI_REF=${{ steps.ref.outputs.asobi_ref }}
          push: true
          tags: |
            ${{ steps.ref.outputs.image_base }}:${{ inputs.image_tag || steps.ref.outputs.asobi_ref }}
            ${{ steps.ref.outputs.image_base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        if: steps.skip.outputs.skip != 'true'
        run: |
          echo "Imagen publicada:"
          echo "  ${{ steps.ref.outputs.image_base }}:${{ inputs.image_tag || steps.ref.outputs.asobi_ref }}"
          echo "  ${{ steps.ref.outputs.image_base }}:latest"
